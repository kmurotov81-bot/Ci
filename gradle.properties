# =============================================================================
# gradle.properties — loyihaning global Gradle/Android sozlamalari.
#
# Bu fayl bo'lmasa, AGP standart Android/AndroidX kutubxonalarini to'g'ri
# aniqlay olmaydi va "checkDebugAarMetadata" kabi vazifalar
# "android.useAndroidX property is not enabled" xatosi bilan qulaydi.
# =============================================================================

# MAJBURIY: barcha zamonaviy Android loyihalari AndroidX kutubxonalariga
# asoslangan (androidx.core, androidx.compose va h.k. — bu loyihada ham
# ular ishlatilgan). Bu qator bo'lmasa, AGP eski support-library
# formatini kutadi va build "AarMetadata" bosqichida qulaydi.
android.useAndroidX=true

# Jetifier — eski (AndroidX'gacha bo'lgan) support-library kutubxonalarini
# avtomatik AndroidX'ga aylantiruvchi vosita. Bu loyihada barcha
# dependency'lar (gradle/libs.versions.toml) allaqachon AndroidX-native,
# shuning uchun Jetifier'ga hojat yo'q — o'chirilgan holda build biroz
# tezroq ishlaydi.
android.enableJetifier=false

# Jetifier o'chirilgan bo'lsa ham (yuqorida), ba'zi eski, hali AndroidX'ga
# o'tmagan uchinchi tomon kutubxonalar bilan kelajakda muammo chiqsa,
# ularni shu ro'yxatga (vergul bilan ajratib) qo'shish mumkin. Hozircha
# bo'sh — hech qanday kutubxona istisno qilinishi shart emas.
org.gradle.jetifier.blacklist=

# Kotlin kod uslubi — JetBrains rasmiy konventsiyasi.
kotlin.code.style=official

# --- Build tezligi/samaradorligi uchun standart tavsiyalar ---

# Bir nechta modul (bu loyihada hozircha faqat :app, lekin kelajakda
# modul qo'shilsa) parallel build qilinadi.
org.gradle.parallel=true

# Gradle build keshi — o'zgarmagan tasklarni qayta bajarmaydi, CI'da
# ham, mahalliy build'da ham sezilarli tezlashtiradi.
org.gradle.caching=true

# --- Qo'shimcha, xuddi shunday "not configured" xatolarining oldini
#     oluvchi standart AGP/Gradle sozlamalari ---

# JVM xotirasi — Compose + KSP (Room) + TensorFlow Lite kabi og'ir
# dependency'lar bilan standart JVM heap (odatda 512m atrofida) yetarli
# bo'lmasligi mumkin, ayniqsa GitHub Actions kabi cheklangan resursli
# CI runner'larda — bu esa "OutOfMemoryError" yoki tushunarsiz build
# qulashlariga olib kelishi mumkin.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin kompilyator daemon'i uchun alohida xotira (KSP + Compose bilan
# "OutOfMemoryError"ning oldini oladi).
kotlin.daemon.jvmargs=-Xmx2g

# AGP 8+ da tavsiya etilgan standart: har bir modul faqat o'zining
# to'g'ridan-to'g'ri e'lon qilgan resurslariga (R class) murojaat qiladi
# (tranzitiv emas). Kelajakda modul soni oshsa, resurs to'qnashuvlari va
# sekin build'larning oldini oladi; bitta modulli loyihada ham zararsiz.
android.nonTransitiveRClass=true
